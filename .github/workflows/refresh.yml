name: refresh

# Daily redeploy to pick up new commit data baked at build time.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Trigger Cloudflare deploy hook
        env:
          HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "CLOUDFLARE_DEPLOY_HOOK secret is not set; nothing to do."
            exit 0
          fi
          curl -fsSL -X POST "$HOOK"

      - uses: actions/checkout@v4

      # GitHub disables scheduled workflows after 60 days without a commit.
      # ponytail: empty commit once the last one is 50 days old, not every run.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -lt 4320000 ]; then
            echo "Last commit is under 50 days old; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive"
          git push
